[package]
name = "pocket-data-mining"
version = "0.1.0"
edition = "2024"
default-run = "air-huim"

[[bin]]
name = "air-huim"
path = "src/main.rs"

[[bin]]
name = "air-huim-preprocess"
path = "src/bin/preprocess.rs"

[features]
default = ["compress"]
compress = ["lz4_flex"]
# io_uring = ["tokio-uring"]  # Skipped as per instruction

[dependencies]
bitflags = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
smallvec = { version = "1", features = ["union"] }
lz4_flex = { version = "0.11", optional = true }
crc32fast = "1"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.39.6"
rand = "0.8.5"
ratatui = "0.26"
crossterm = "0.27"
dashmap = "6.2.1"
dialoguer = "0.12.0"

[dev-dependencies]
bitflags = "2"
tempfile = "3"
proptest = "1"
[lib]
name = "pocket_data_mining"
path = "src/lib.rs"
